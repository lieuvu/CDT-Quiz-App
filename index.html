<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Quiz App</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background-color: #f8f9fa;
    }

    #question-container {
      min-height: 200px;
    }

    #result-details .card {
      margin-bottom: 1rem;
    }

    #previous-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="bg-primary text-white">
    <div class="container py-4">
      <h1 class="mb-1">Quiz App</h1>
      <p class="mb-0">
        Practice and review your question banks
      </p>
    </div>
  </header>


  <!-- Main Content -->
  <main class="container py-4">
    <!-- Quiz Selection -->
    <section id="quiz-selection" class="mb-4">

      <div class="card shadow-sm">

        <div class="card-body">

          <h2 class="card-title h4">
            Select Question Bank
          </h2>

          <p class="text-body-secondary">
            Choose a question bank to begin.
          </p>

          <div class="mb-3">

            <label for="quiz-select" class="form-label">
              Question Bank
            </label>

            <select id="quiz-select" class="form-select">
              <option value="">
                Select a quiz...
              </option>

              <option value="data/quiz-001.json" data-quiz-id="quiz-01">
                Quiz 1
              </option>

              <option value="data/quiz-002.json" data-quiz-id="quiz-02">
                Quiz 2
              </option>
              
              <option value="data/quiz-003.json" data-quiz-id="quiz-02">
                Quiz 3
              </option>

              <option value="data/quiz-004.json" data-quiz-id="quiz-02">
                Quiz 4
              </option>
            </select>
          </div>

          <button id="load-quiz-btn" type="button" class="btn btn-primary" disabled>
            Load Quiz
          </button>

          <!-- Status / Error Message -->
          <div id="load-status" class="mt-3" role="alert" hidden></div>
        </div>

      </div>

    </section>

    <!-- Quiz Information -->
    <section id="quiz-info" class="mb-4 d-none">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 id="quiz-title" class="card-title h3">
            Quiz Title
          </h2>

          <p id="quiz-description" class="card-text text-body-secondary">
            Quiz Description
          </p>

          <div id="quiz-meta" class="small text-body-secondary">
            0 questions
          </div>
        </div>
      </div>
    </section>


    <!-- Quiz Area -->
    <section id="quiz-area" class="d-none">

      <!-- Progress -->
      <div class="d-flex justify-content-between mb-2">
        <span id="question-progress">
        </span>

        <span id="question-score">
        </span>
      </div>

      <div class="progress mb-4" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100">
        <div id="quiz-progress-bar" class="progress-bar" style="width: 0%"></div>
      </div>


      <!-- Question Container -->
      <div id="question-container" tabindex="-1">

        <!-- JavaScript will render questions here -->

      </div>


      <!-- Quiz Navigation -->
      <div id="quiz-navigation" class="d-flex justify-content-between mt-4">
        <button id="previous-btn" type="button" class="btn btn-outline-primary" disabled>
          Previous
        </button>

        <button id="next-btn" type="button" class="btn btn-primary">
          Next
        </button>
      </div>


      <!-- Submit -->
      <div id="submit-container" class="text-center mt-4 mb-4 d-none">
        <button id="submit-btn" type="button" class="btn btn-success btn-lg">
          Submit Quiz
        </button>
      </div>
    </section>


    <!-- Results -->
    <section id="results-area" class="mt-4 d-none">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title">Quiz Results</h2>

          <div id="result-summary" class="mb-4">
            <!-- Summary generated by JavaScript -->
          </div>

          <div id="result-details">
            <!-- Question review generated by JavaScript -->
          </div>

          <div class="mt-4">
            <button id="restart-btn" type="button" class="btn btn-primary">
              Restart Quiz
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Unanswered Question Modal -->
    <div class="modal fade" id="unanswered-modal" tabindex="-1" aria-labelledby="unanswered-modal-title"
      aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="unanswered-modal-title">
              Unanswered Questions
            </h2>

            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <p>
              Please answer the following questions
              before submitting the quiz:
            </p>

            <div id="unanswered-question-list" class="list-group">
              <!-- JavaScript will populate this -->
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Close
            </button>

          </div>

        </div>

      </div>
    </div>
  </main>


  <!-- Footer -->
  <footer class="border-top mt-5">
    <div class="container py-3">
      <p class="text-body-secondary text-center mb-0">
      CDT - Digital Workflow Quiz App
      </p>
    </div>
  </footer>


  <!-- JavaScript Libraries -->

  <!-- jQuery -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Application JavaScript -->
  <script src="./app.js"></script>

</body>

</html>
